name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # - name: Set up R and Rscript
      #   uses: r-lib/actions/setup-r@v2
      #   with:
      #     r-version: release
      #     use-public-rspm: true
      # - name: Install R packages used by coffee_maps.R
      #   run: |
      #     Rscript -e 'install.packages(c("tidyverse", "plotly"))'
      - name: Run GatorGrader with GatorGrade
        if: always()
        run:  |
          pip install gatorgrade
          gatorgrade --config config/gatorgrade.yml





